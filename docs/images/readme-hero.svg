    <text x="755" y="292" fill="#DEF2EA" font-size="15" font-weight="600">A grounded starting point</text>
    <rect x="721" y="309" width="77" height="21" rx="5" fill="#33504F"/><text x="731" y="323" fill="#B7DDCF" font-size="10">Source 1 ↗</text>
    <rect x="806" y="309" width="77" height="21" rx="5" fill="#33504F"/><text x="816" y="323" fill="#B7DDCF" font-size="10">Source 2 ↗</text>
    <text x="1102" y="324" text-anchor="end" fill="#9AB7B2" font-size="10">Inspect the evidence</text>
  </g>
