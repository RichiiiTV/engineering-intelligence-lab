<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Intelligence Lab</title>
  <desc id="desc">Machine documentation flows through a local knowledge backbone into a cited troubleshooting answer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#121C31"/><stop offset="1" stop-color="#242447"/></linearGradient>
    <linearGradient id="accent" x1="55" y1="70" x2="99" y2="114" gradientUnits="userSpaceOnUse"><stop stop-color="#B4A3FF"/><stop offset="1" stop-color="#7D68EE"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#D4CDFF" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="20" fill="url(#background)"/>
  <rect width="1200" height="420" rx="20" fill="url(#grid)"/>
  <path d="M630 420L852 0H1200V420H630Z" fill="#8774DB" fill-opacity=".045"/>
  <rect x="54" y="48" width="42" height="42" rx="12" fill="url(#accent)"/>
  <path d="M65 60H84M65 69H80M65 78H84" stroke="#181D34" stroke-width="3.5" stroke-linecap="round"/>
