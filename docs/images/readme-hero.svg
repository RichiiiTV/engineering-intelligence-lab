    <text x="110" y="86" fill="#B2B9D1" font-size="12" letter-spacing="1.4">ENGINEERING INTELLIGENCE LAB</text>
    <text x="54" y="161" fill="#FAFAFF" font-size="49" font-weight="700" letter-spacing="-1.5">Machine problems.</text>
    <text x="54" y="222" fill="#C7BBFF" font-size="49" font-weight="700" letter-spacing="-1.5">Clearer answers.</text>
    <text x="56" y="270" fill="#C3C9DC" font-size="18">Your manuals, code and logs.</text>
    <text x="56" y="298" fill="#C3C9DC" font-size="18">One chat. Sources you can inspect.</text>
    <rect x="54" y="341" width="122" height="30" rx="15" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".12"/>
    <circle cx="72" cy="356" r="3.5" fill="#90D7C3"/><text x="83" y="361" fill="#D8DCEC" font-size="12">Local models</text>
    <rect x="187" y="341" width="121" height="30" rx="15" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".12"/>
    <text x="203" y="361" fill="#D8DCEC" font-size="12">Deutsch / English</text>
    <rect x="319" y="341" width="142" height="30" rx="15" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".12"/>
    <text x="335" y="361" fill="#D8DCEC" font-size="12">Read-only by design</text>
    <rect x="678" y="49" width="464" height="321" rx="16" fill="#131C30" stroke="#69729A" stroke-opacity=".4"/>
    <circle cx="700" cy="70" r="3" fill="#626D8E"/><circle cx="712" cy="70" r="3" fill="#626D8E"/><circle cx="724" cy="70" r="3" fill="#626D8E"/>
    <text x="1116" y="74" text-anchor="end" fill="#8F9ABA" font-size="10" letter-spacing="1.5">DOCUMENT → ANSWER</text>
    <rect x="701" y="94" width="128" height="41" rx="8" fill="#202B44"/><rect x="840" y="94" width="128" height="41" rx="8" fill="#202B44"/><rect x="979" y="94" width="140" height="41" rx="8" fill="#202B44"/>
    <text x="716" y="119" fill="#CBD2E7" font-size="12" font-family="Consolas, monospace">manual.pdf</text>
    <text x="853" y="119" fill="#CBD2E7" font-size="12" font-family="Consolas, monospace">controller.st</text>
    <text x="994" y="119" fill="#CBD2E7" font-size="12" font-family="Consolas, monospace">fault.log</text>
    <path d="M765 136V151H1049V136M904 136V164" stroke="#8B80BE" stroke-opacity=".7"/>
    <path d="M900 160L904 164L908 160" stroke="#8B80BE" stroke-linecap="round"/>
    <rect x="701" y="170" width="418" height="63" rx="10" fill="#302A50" stroke="#9C86EF" stroke-opacity=".6"/>
