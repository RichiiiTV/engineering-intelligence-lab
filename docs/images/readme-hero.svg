    <text x="755" y="218" fill="#B9B0D7" font-size="11">Match · Retrieve · Investigate</text>
    <path d="M904 234V253M900 249L904 253L908 249" stroke="#8B80BE" stroke-linecap="round"/>
    <rect x="701" y="260" width="418" height="86" rx="10" fill="#1D303C" stroke="#6DAB9D" stroke-opacity=".5"/>
