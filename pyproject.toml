[project]
name = "engineering-intelligence-lab"
version = "0.2.0"
description = "Local-first agentic engineering investigation workbench"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "deepagents>=0.7.32,<0.8",
    "langchain>=1.4.7,<2",
    "langgraph>=1.2.18,<2",
    "langgraph-checkpoint-sqlite>=3.1.2,<4",
    "langchain-ollama>=1.1,<2",
    "ollama>=0.6.3,<1",
    "duckdb>=1.3,<2",
    "python-dotenv>=1,<2",
    "httpx>=0.28,<1",
]
[project.optional-dependencies]
documents = ["docling>=2,<3"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/eil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["eil"]
