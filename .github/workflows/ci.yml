name: Offline acceptance and dependency audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      UV_CACHE_DIR: .uv-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --extra dev --extra hosted
      - run: uv run ruff check backend/src/eil tests
      - run: uv run ruff format --check backend/src/eil tests
      - run: uv run pytest -q
      - run: uv run python -m eil.benchmark --provider offline --agent-mode both --repetitions 2 --output reports/ci-calibration
      - run: uv run python -m eil.benchmark_extended --provider offline --agent-mode both --repetitions 2 --output reports/ci-extended-calibration
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --extra dev --extra hosted
      - run: uv tool run pip-audit --path .venv/lib/python3.12/site-packages --skip-editable
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm audit --audit-level=low
        working-directory: frontend
